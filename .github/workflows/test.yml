name: Tests
on:
  push:
    branches: [azure-global-config]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm format:check
      - run: corepack pnpm run gates:typecheck
      - run: corepack pnpm test
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --with playwright python -m playwright install --with-deps chromium
      - run: uv run --no-project --with playwright python .ai/validation/companion-browser-smoke.py
